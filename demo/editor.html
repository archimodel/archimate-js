<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>archimate-js Editor Demo</title>
    <link rel="stylesheet" href="../node_modules/diagram-js/assets/diagram-js.css">
    <link rel="stylesheet" href="../archimate-font/lib/css/archimate-font.css">
    <link rel="stylesheet" href="../assets/palette-icons.css?v=20260708-2">
    <link rel="stylesheet" href="./demo.css?v=20260708-2">
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-topbar">
        <div class="demo-title">archimate-js Editor Demo</div>
        <nav class="demo-nav" aria-label="Demo navigation">
          <a id="viewer-link" href="./viewer.html?version=4.0">Viewer</a>
          <a id="editor-link" href="./editor.html?version=4.0" aria-current="page">Editor</a>
          <a href="../archimate-font/lib/demo.html">Font</a>
        </nav>
        <div class="demo-version-switch" aria-label="ArchiMate version">
          <a id="version-3-link" href="./editor.html?version=3.2">3.x</a>
          <a id="version-4-link" href="./editor.html?version=4.0">4.0</a>
        </div>
        <div class="demo-actions">
          <button id="reset-sample" class="demo-button" type="button">Reset Sample</button>
          <button id="new-model" class="demo-button" type="button">New Model</button>
        </div>
        <div id="status" class="demo-status">loading</div>
      </header>
      <main class="demo-main">
        <aside class="demo-side">
          <h2>Sample</h2>
          <dl>
            <dt>Mode</dt>
            <dd id="profile-mode">Editor</dd>
            <dt>Version</dt>
            <dd id="profile-version">ArchiMate 4.0</dd>
            <dt>Profile</dt>
            <dd id="profile-summary">ArchiMate 4.0 profile</dd>
            <dt>Palette</dt>
            <dd id="palette-summary">4.0 palette</dd>
            <dt>Editing</dt>
            <dd id="editing-summary">4.0 editor validation</dd>
          </dl>
          <div class="demo-conformance" aria-label="ArchiMate conformance status">
            <h2>Conformance</h2>
            <dl>
              <dt>Status</dt>
              <dd id="conformance-state">loading</dd>
              <dt>Boundary</dt>
              <dd id="conformance-summary">loading</dd>
              <dt>Sources</dt>
              <dd id="conformance-required">loading</dd>
              <dt>Companion</dt>
              <dd id="conformance-companion">loading</dd>
            </dl>
            <ul id="conformance-actions" class="demo-conformance-actions"></ul>
          </div>
        </aside>
        <section class="demo-canvas" aria-label="ArchiMate editor canvas">
          <div id="canvas"></div>
        </section>
      </main>
    </div>
    <script src="./dist/editor.bundle.js"></script>
  </body>
</html>
