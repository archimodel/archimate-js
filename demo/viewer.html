<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>archimate-js Viewer Demo</title>
    <link rel="stylesheet" href="../node_modules/diagram-js/assets/diagram-js.css">
    <link rel="stylesheet" href="../archimate-font/lib/css/archimate-font.css">
    <link rel="stylesheet" href="../assets/palette-icons.css?v=20260708-2">
    <link rel="stylesheet" href="./demo.css?v=20260708-2">
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-topbar">
        <div class="demo-title">archimate-js Viewer Demo</div>
        <nav class="demo-nav" aria-label="Demo navigation">
          <a id="viewer-link" href="./viewer.html?version=4.0" aria-current="page">Viewer</a>
          <a id="editor-link" href="./editor.html?version=4.0">Editor</a>
          <a href="../archimate-font/lib/demo.html">Font</a>
        </nav>
        <div class="demo-version-switch" aria-label="ArchiMate version">
          <a id="version-3-link" href="./viewer.html?version=3.2">3.x</a>
          <a id="version-4-link" href="./viewer.html?version=4.0">4.0</a>
        </div>
        <div id="status" class="demo-status">loading</div>
      </header>
      <main class="demo-main">
        <aside class="demo-side">
          <h2>Sample</h2>
          <dl>
            <dt>Mode</dt>
            <dd id="profile-mode">Viewer</dd>
            <dt>Version</dt>
            <dd id="profile-version">ArchiMate 4.0</dd>
            <dt>Profile</dt>
            <dd id="profile-summary">ArchiMate 4.0 profile</dd>
            <dt>Canvas</dt>
            <dd id="editing-summary">Read-only display validation</dd>
            <dt>Palette</dt>
            <dd id="palette-summary">4.0 palette</dd>
          </dl>
        </aside>
        <section class="demo-canvas" aria-label="ArchiMate viewer canvas">
          <div id="canvas"></div>
        </section>
      </main>
    </div>
    <script src="./dist/viewer.bundle.js"></script>
  </body>
</html>
