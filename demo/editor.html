<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>archimate-js Editor Demo</title>
    <link rel="stylesheet" href="../node_modules/diagram-js/assets/diagram-js.css">
    <link rel="stylesheet" href="../archimate-font/lib/css/archimate-font.css">
    <link rel="stylesheet" href="../assets/palette-icons.css">
    <link rel="stylesheet" href="./demo.css">
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-topbar">
        <div class="demo-title">archimate-js Editor Demo</div>
        <nav class="demo-nav" aria-label="Demo navigation">
          <a href="./viewer.html">Viewer</a>
          <a href="./editor.html" aria-current="page">Editor</a>
          <a href="../archimate-font/lib/demo.html">Font</a>
        </nav>
        <div class="demo-actions">
          <button id="reset-sample" class="demo-button" type="button">Reset Sample</button>
          <button id="new-model" class="demo-button" type="button">New Model</button>
        </div>
        <div id="status" class="demo-status">loading</div>
      </header>
      <main class="demo-main">
        <aside class="demo-side">
          <h2>Sample</h2>
          <dl>
            <dt>Mode</dt>
            <dd>Editor</dd>
            <dt>Version</dt>
            <dd>ArchiMate 4.0</dd>
            <dt>Palette</dt>
            <dd>Enabled</dd>
            <dt>Editing</dt>
            <dd>Enabled</dd>
          </dl>
        </aside>
        <section class="demo-canvas" aria-label="ArchiMate editor canvas">
          <div id="canvas"></div>
        </section>
      </main>
    </div>
    <script src="./dist/editor.bundle.js"></script>
  </body>
</html>
